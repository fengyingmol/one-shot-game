<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff0ce"><title>一发入魂 · 玩具小院</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="casual.css"></head>
<body class="loading">

<section id="loadingScreen" aria-label="加载游戏"><div class="loading-card"><div class="loading-mark" aria-hidden="true"><img src="assets/icons/bullseye.svg" alt=""></div><p class="loading-kicker">玩具小院 · 弹射挑战</p><h1>一发入魂</h1><p class="loading-subtitle">找准角度，让每一发都算数。</p><progress id="loadingProgress" max="19" value="0" aria-label="游戏素材加载进度"></progress><p id="loadingStatus" role="status">准备加载…</p><button id="loadingStart" hidden>点击进入游戏</button><button id="loadingRetry" hidden>重新加载</button><noscript>请开启浏览器 JavaScript 后重新打开游戏。</noscript></div></section>
<main inert>
 <header><a class="brand" href="./"><img class="title-art" data-asset="toy-title" alt="一发入魂"><span>玩具小院</span></a></header>
 <section class="intro"><p>找个角度，让这一枪多飞一会。</p></section>
 <section class="game-layout" id="gameLayout">
  <div class="play-column">
   <div class="arena-wrap"><div class="arena-top"><span id="levelName"></span><div class="arena-stats"><span id="counter"></span><span id="scoreHud">得分 0</span></div></div><canvas id="game" width="600" height="900" aria-label="弹射游戏，拖动瞄准，松手开枪，底部开放"></canvas><div id="result" class="result" hidden><span id="resultTag"></span><h2 id="resultTitle"></h2><div id="resultStars" class="result-stars" role="img" aria-label="本次评价" hidden></div><div id="resultScore" class="result-score"></div><p id="resultTargets" class="result-targets"></p><p id="resultRatingHint" class="result-rating-hint" role="status"></p><p id="resultBreakdown"></p><p id="resultDesc"></p><div class="result-actions"><button id="resultRetry" hidden>重试冲星</button><button id="resultAction"></button></div></div><div class="arena-bottom"><span id="stateText">拖动瞄准 · 松手开枪</span><span id="combo">一颗子弹</span></div></div>
   <section class="ammo-panel" aria-label="当前子弹"><button id="ammoCurrent" class="ammo-current" aria-haspopup="dialog" aria-expanded="false" aria-controls="ammoPicker"><img id="currentAmmoIcon" class="ammo-icon" alt=""><span id="currentAmmoName"></span><span class="ammo-switch-hint" id="ammoSwitchHint"><img src="assets/icons/chevron-up.svg" alt="">点击换弹</span></button><p id="ammoSummary"></p></section>
   <div class="play-actions"><button id="retry" aria-label="重试本关" title="重试本关"><img class="icon" src="assets/icons/arrow-clockwise.svg" alt=""><span>重试本关</span></button><button id="openSettings" aria-expanded="false" aria-controls="settingsDialog" aria-label="设置" title="设置"><img class="icon" src="assets/icons/gear-fill.svg" alt=""><span>设置</span></button><button id="openLevels" aria-expanded="false" aria-controls="levelPanel" aria-label="关卡选择" title="关卡选择"><img class="icon" src="assets/icons/grid.svg" alt=""><span>关卡选择</span></button></div>
   <button id="viewTrajectory" class="secondary trajectory-button" aria-pressed="false" disabled>查看轨迹</button>
  </div>
  <div id="ammoBackdrop" class="ammo-backdrop" hidden></div>
  <section id="ammoPicker" class="ammo-picker" role="dialog" aria-modal="true" aria-labelledby="ammoPickerTitle" aria-describedby="ammoPickerHelp" hidden><div class="ammo-picker-heading"><div><h2 id="ammoPickerTitle">选择子弹</h2><p id="ammoPickerHelp">点击一种子弹，换好就能开枪</p></div><button id="closeAmmoPicker" aria-label="收起子弹列表">收起</button></div><div id="ammoChoices" class="ammo-choices"></div></section>
  <div id="menuBackdrop" class="menu-backdrop" hidden></div>
  <aside id="levelsDialog" aria-label="关卡选择"><div class="menu-heading"><div><span class="menu-kicker">一发入魂</span><h2>关卡选择</h2></div><button id="closeLevels" aria-label="关闭关卡选择">返回游戏</button></div>
   <details id="levelPanel"><summary>选择关卡</summary><nav id="levels" aria-label="正式与测试关卡"></nav>
    <section id="statsPanel"><h3 class="panel-section-title">本关成绩</h3><section id="comparison" class="comparison"><p id="ratingGoal" class="rating-goal"></p><table><thead><tr><th>记录</th><th>最近击倒</th><th>最佳击倒</th><th>最高分</th><th>最佳星级</th><th>次数</th></tr></thead><tbody id="comparisonRows"></tbody></table><p>每关独立记录；刷新清空。下一枪保留场景。</p></section></section>
   </details>
  </aside>
  <aside id="settingsDialog" aria-label="设置" hidden><div class="menu-heading"><div><span class="menu-kicker">一发入魂</span><h2>设置</h2></div><button id="closeSettings" aria-label="关闭设置">返回游戏</button></div>
   <section id="audioPanel"><h3 class="panel-section-title">声音</h3><button id="sound" aria-pressed="true"><img class="icon" src="assets/icons/volume-up.svg" alt=""><span id="soundLabel">声音：开</span></button><p id="audioStatus" role="status">默认开启 · 点击进入后播放</p><div class="audio-toggles"><button id="musicToggle" aria-pressed="true">音乐：开</button><button id="sfxToggle" aria-pressed="true">音效：开</button></div><label class="audio-volume" for="audioVolume">音量<input id="audioVolume" type="range" min="0" max="100" value="75" aria-label="游戏总音量"></label></section>
  </aside>
 </section><footer>无体力 · 无倒计时 · 随时重来</footer>
</main><script src="soundtrack.js"></script><script src="player-bootstrap.js"></script><script src="garden-frame.js"></script><script src="game.js"></script><script src="audio.js"></script></body></html>
